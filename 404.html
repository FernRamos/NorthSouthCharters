<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // GitHub Pages SPA redirect (works with BrowserRouter)
      (function () {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;

        // Send user back to index with the path stored in ?redirect=
        var redirectUrl = "/?redirect=" + encodeURIComponent(path + search + hash);
        window.location.replace(redirectUrl);
      })();
    </script>
  </head>
  <body></body>
</html>
